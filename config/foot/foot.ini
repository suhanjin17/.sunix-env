# Keep Debian's non-color defaults.
include=/etc/xdg/foot/foot.ini
font=monospace:size=12
selection-target=none

[key-bindings]
clipboard-copy=Control+c XF86Copy
clipboard-paste=Control+v XF86Paste

# Keep an explicit shortcut for interrupting terminal programs.
[text-bindings]
\x03=Control+Shift+c

# Linux console palette with white text on black and mint instead of blue.
[colors]
background=000000
foreground=ffffff

regular0=000000
regular1=aa0000
regular2=00aa00
regular3=aa5500
regular4=58b8bb
regular5=aa00aa
regular6=00aaaa
regular7=aaaaaa

bright0=555555
bright1=ff5555
bright2=55ff55
bright3=ffff55
bright4=64ccc9
bright5=ff55ff
bright6=55ffff
bright7=ffffff

# Forward background terminal bells to Sway workspace urgency.
[bell]
urgent=yes
